<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadline Countdown</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
        color: #333333;
        position: relative;
        overflow: hidden;
        flex-direction: column;
      }

      h1,
      h2 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 500;
        font-family: "Frank Ruhl Libre", serif;
        z-index: 7;
      }

      h1 {
        margin-top: 80px;
        margin-bottom: 100px;
      }

      .countdown {
        display: flex;
        gap: 60px;
        margin-bottom: 20px;
        justify-content: center;
      }

      .countdown div {
        text-align: center;
      }

      .countdown .time {
        font-size: 60px;
        font-weight: 400;
        font-family: "Frank Ruhl Libre", serif;
        color: rgb(17, 35, 53);
        z-index: 5;
      }

      .countdown .label {
        text-transform: uppercase;
        font-size: 14px;
        font-family: "Frank Ruhl Libre", serif;
        font-weight: 500;
        color: rgb(136, 155, 183);
        z-index: 5;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 15px;
        /* position: absolute; */
        /* bottom: 0%; */
        /* left: 50%; */
        /* transform: translateX(-50%); */
      }

      .telegram {
        width: 55px;
      }

      .instagram {
        width: 30px;
        border-radius: 50%;
      }

      .soon {
        font-size: 50px;
      }

      .social-icons a {
        text-decoration: none;
        width: 60px;
        height: 60px;
        background: #eff5f9;
        color: #112335;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        font-size: 32px;
        transition: transform 0.3s ease, background-color 0.3s ease;
      }

      .social-icons a:hover {
        transform: scale(1.1);
        background-color: #2f80ed;
        color: #ffffff;
      }

      .bg-anim {
        position: absolute;
        font-size: 1rem;
        animation: float 2s infinite alternate;
        z-index: -2;
      }

      .bg-anim i {
        font-size: 12px;
        z-index: -1;
      }
      .content{
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100vh;
        padding: 20px 0;
      }

      @keyframes float {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(15px);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .countdown {
          gap: 30px;
        }

        .countdown .time {
          font-size: 50px;
        }

        .countdown .label {
          font-size: 12px;
        }

        h1 {
          margin-top: 80px;
          margin-bottom: 50px;
        }

        .social-icons {
          bottom: 30px;
        }
      }

      @media (max-width: 468px) {
        h1 {
          margin-top: 50px;
          margin-bottom: 40px;
          font-size: 30px;
        }

        .soon {
          font-size: 30px;
        }

        .countdown {
          flex-direction: row;
        }

        .countdown .time {
          font-size: 40px;
        }

        .countdown .label {
          font-size: 12px;
        }

        .social-icons {
          bottom: 10px;
        }

        .social-icons a {
          width: 50px;
          height: 50px;
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="tilde-container"></div>

    <div class="content">
      <h1>QUIZY</h1>
      <div>
        <h2 class="soon" style="color: #2f80ed">TEZ KUNDA!</h2>
        <div class="countdown">
          <div>
            <span class="time" id="days">00</span><br />
            <span class="label">days</span>
          </div>
          <div>
            <span class="time" id="hours">00</span><br />
            <span class="label">hours</span>
          </div>
          <div>
            <span class="time" id="minutes">00</span><br />
            <span class="label">minutes</span>
          </div>
          <div>
            <span class="time" id="seconds">00</span><br />
            <span class="label">seconds</span>
          </div>
        </div> 
      </div>
      <div class="social-icons">
        <a href="https://www.instagram.com/quizy_uz" target="_blank"
          ><img
            src="images/instagram.webp"
            class="instagram"
            alt="Instagram Logo"
        /></a>
        <a href="https://t.me/quizy_uz" target="_blank"
          ><img src="images/telegram.png" class="telegram" alt="Telegram Logo"
        /></a>
      </div>
    </div>

    <script>
      function generateRandomColor() {
        const letters = "0123456789ABCDEF";
        let color = "#";
        for (let i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
      }

      function generateRandomPosition() {
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        return {x, y};
      }

      function createTilde() {
        const container = document.getElementById("tilde-container");
        const tilde = document.createElement("div");

        const {x, y} = generateRandomPosition();
        const color = generateRandomColor();

        tilde.className = "bg-anim";
        tilde.style.color = color;
        tilde.style.top = `${y}%`;
        tilde.style.left = `${x}%`;

        const symbols = [
          '<i class="fa-solid fa-tilde"></i>',
          '<i class="fa-solid fa-caret-up"></i>',
          '<i class="fa-solid fa-minus"></i>',
          '<i class="fa-solid fa-bolt"></i>',
          '<i class="fa-solid fa-star-of-life"></i>',
          '<i class="fa-solid fa-diamond"></i>',
        ];

        tilde.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

        container.appendChild(tilde);
      }

      for (let i = 0; i < 15; i++) {
        createTilde();
      }

      const countdown = () => {
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        const targetDate = new Date(2025, 1, 15, 0, 0, 0);

        const updateCountdown = () => {
          const now = new Date();
          const diff = targetDate - now;

          if (diff <= 0) {
            clearInterval(interval);
            daysEl.textContent = 0;
            hoursEl.textContent = 0;
            minutesEl.textContent = 0;
            secondsEl.textContent = 0;
            return;
          }

          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor(
            (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
          );
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          daysEl.textContent = days;
          hoursEl.textContent = hours;
          minutesEl.textContent = minutes;
          secondsEl.textContent = seconds;
        };

        const interval = setInterval(updateCountdown, 1000);
      };

      countdown();
    </script>
  </body>
</html>
